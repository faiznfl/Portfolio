<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="omni-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#001a3d"/>
    </linearGradient>
    <linearGradient id="ps-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0070d1"/>
      <stop offset="100%" stop-color="#004d8d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#omni-bg)"/>
  <!-- Grid Matrix -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  <!-- Architectural Nodes -->
  <circle cx="200" cy="225" r="48" fill="#121826" stroke="#0070d1" stroke-width="2" filter="url(#glow)"/>
  <circle cx="400" cy="160" r="42" fill="#121826" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="400" cy="290" r="42" fill="#121826" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="600" cy="225" r="54" fill="#121826" stroke="#0070d1" stroke-width="3" filter="url(#glow)"/>
  <!-- Connection Paths -->
  <path d="M248 225 L358 160" stroke="#0070d1" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M248 225 L358 290" stroke="#0070d1" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M442 160 L546 225" stroke="#38bdf8" stroke-width="2"/>
  <path d="M442 290 L546 225" stroke="#38bdf8" stroke-width="2"/>
  <!-- Node Labels -->
  <text x="200" y="222" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">API Gateway</text>
  <text x="200" y="238" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Multi-Tenant</text>
  <text x="400" y="157" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Redis Lock</text>
  <text x="400" y="173" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Atomic Decrement</text>
  <text x="400" y="287" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Kafka Event</text>
  <text x="400" y="303" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Order Queue</text>
  <text x="600" y="220" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="600" y="238" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Partitioned Shards</text>
  <!-- Overlay Title Card -->
  <rect x="40" y="30" width="260" height="42" rx="21" fill="rgba(0,112,209,0.18)" stroke="rgba(0,112,209,0.5)" stroke-width="1"/>
  <text x="170" y="56" fill="#53b1ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ HIGH-THROUGHPUT ENGINE</text>
  <!-- PlayStation Accent Corner -->
  <polygon points="760,20 780,20 780,40" fill="#0070d1"/>
</svg>

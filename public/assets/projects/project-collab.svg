<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="collab-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141f"/>
      <stop offset="100%" stop-color="#14263b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#collab-bg)"/>
  <!-- Multi-user Cursors & Canvas Elements -->
  <rect x="220" y="140" width="200" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="320" y="205" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Microservice Mesh</text>
  <!-- User 1 cursor -->
  <g transform="translate(390, 130)">
    <polygon points="0,0 12,24 16,16 24,12" fill="#ec4899"/>
    <rect x="15" y="15" width="80" height="22" rx="4" fill="#ec4899"/>
    <text x="55" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Sarah (Lead)</text>
  </g>
  <!-- User 2 cursor -->
  <g transform="translate(240, 240)">
    <polygon points="0,0 12,24 16,16 24,12" fill="#0070d1"/>
    <rect x="15" y="15" width="70" height="22" rx="4" fill="#0070d1"/>
    <text x="50" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Faiz (You)</text>
  </g>
  <rect x="40" y="30" width="240" height="42" rx="21" fill="rgba(56,189,248,0.18)" stroke="rgba(56,189,248,0.4)" stroke-width="1"/>
  <text x="160" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🎨 REALTIME CRDT CANVAS</text>
  <text x="400" y="365" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">60 FPS Hardware-Accelerated Whiteboard</text>
  <text x="400" y="390" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Conflict-Free Replicated Data Types &amp; Binary WebSockets</text>
</svg>

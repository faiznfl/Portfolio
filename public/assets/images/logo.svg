<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#111827" />
            <stop offset="100%" stop-color="#070a13" />
        </linearGradient>

        <!-- Border Glow Gradient -->
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="50%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>

        <!-- Monogram Glyph Gradient -->
        <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>

        <!-- Subtle Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Outer Squircle with Gradient Rim -->
    <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />

    <!-- Ambient Glow Spot -->
    <circle cx="32" cy="32" r="24" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />

    <!-- Pure Capital Letter "F" (No diamond, pure letter typography) -->
    <!-- Centered Vertical Pillar & Horizontal Bars -->
    <path d="M42 32 C42 29.8 43.8 28 46 28 H82 C84.2 28 86 29.8 86 32 V38 C86 40.2 84.2 42 82 42 H56 V52 H76 C78.2 52 80 53.8 80 56 V62 C80 64.2 78.2 66 76 66 H56 V88 C56 90.2 54.2 92 52 92 H46 C43.8 92 42 90.2 42 88 Z" fill="url(#glyphGrad)" opacity="0.95" />
</svg>
